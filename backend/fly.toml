app = "docqa-api-backend"
primary_region = "sin"

[build]

[env]
  DATA_DIR = "/data"
  GEMINI_CHAT_MODEL = "gemini-3.6-flash"
  GEMINI_EMBEDDING_MODEL = "gemini-embedding-2-preview"
  ALLOWED_ORIGINS = '["http://localhost:5173","http://localhost:3000"]'

[[mounts]]
  source = "docqa_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
